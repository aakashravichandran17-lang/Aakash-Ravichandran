<section id="education" class="section education" aria-labelledby="education-heading">
  <div class="container">
    <app-section-header
      eyebrow="Education"
      headingId="education-heading"
      title="Academic"
      highlight="background"
      subtitle="A business foundation combined with self-taught software development."
      [center]="true"
    />

    <div class="education__grid">
      @for (item of education; track item.id; let i = $index) {
        <article class="edu-card glass" appReveal [revealDelay]="i * 100">
          <div class="edu-card__head">
            <span class="edu-card__icon" aria-hidden="true">
              <ng-icon [name]="item.icon" size="22" />
            </span>
            <span class="edu-card__period">{{ item.period }}</span>
          </div>

          <h3 class="edu-card__degree">{{ item.degree }}</h3>
          <p class="edu-card__institution">
            <ng-icon name="mapPin" size="14" aria-hidden="true" />
            {{ item.institution }}
          </p>
          <p class="edu-card__desc">{{ item.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
